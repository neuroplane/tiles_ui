<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a5fc7" />
    <meta name="description" content="Современный интерфейс на основе тайлов" />
    
    <!-- Open Graph / Telegram / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tiles.tagban.ru" />
    <meta property="og:title" content="TILES UI" />
    <meta property="og:description" content="Современный тайловый интерфейс с типами: графики, прогресс, таймеры, списки" />
    <meta property="og:image" content="https://tiles.tagban.ru/og-image-tgb.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="TILES UI" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TILES UI" />
    <meta name="twitter:description" content="Современный тайловый интерфейс" />
    <meta name="twitter:image" content="https://tiles.tagban.ru/og-image-tgb.jpg?v=2" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Тайлы UI" />
    
    <title>Tiles UI</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Регистрация Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA] SW registered:', registration.scope)
            })
            .catch((error) => {
              console.log('[PWA] SW registration failed:', error)
            })
        })
      }
    </script>
  </body>
</html>
