<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#162c42"/>
      <stop offset="100%" style="stop-color:#0c1823"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5fc7"/>
      <stop offset="100%" style="stop-color:#3b4c9f"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a629"/>
      <stop offset="100%" style="stop-color:#008521"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9283a"/>
      <stop offset="100%" style="stop-color:#a1202e"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008080"/>
      <stop offset="100%" style="stop-color:#006666"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Тайлы слева (пример интерфейса) -->
  <rect x="80" y="100" width="140" height="140" fill="url(#tile1)"/>
  <rect x="240" y="100" width="140" height="140" fill="url(#tile2)"/>
  <rect x="400" y="100" width="140" height="140" fill="url(#tile3)"/>
  <rect x="80" y="260" width="140" height="140" fill="url(#tile4)"/>
  <rect x="240" y="260" width="300" height="140" fill="url(#tile1)"/>
  <rect x="80" y="420" width="460" height="140" fill="url(#tile2)"/>
  
  <!-- Заголовок TILES -->
  <text x="700" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="700" fill="#ffffff">TILES</text>
  
  <!-- Подзаголовок UI -->
  <text x="700" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="300" fill="#aaddff">UI</text>
  
  <!-- Описание -->
  <text x="700" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#88aabb">Metro UI Style Tile Components</text>
  
  <!-- URL -->
  <text x="700" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#667799">tiles.tagban.ru</text>
</svg>
